name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      # The tests use a fake adb, so no phone or Android SDK is needed.
      - run: python -m pytest tests -q --cov=phonedeck.core --cov-report=term-missing
